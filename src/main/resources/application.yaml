spring:
  application:
    name: company-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/company_db}
    username: ${DB_USER:company_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8084

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"